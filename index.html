  <!-- 2. Dynamic JWT Authentication Script -->
  <script>
    zE('messenger', 'loginUser', function(callback) {
      // Fetch fresh JWT from your Vercel Serverless API
      fetch('https://zendesk-auth-backend.vercel.app/api/token')
        .then(function(response) {
          if (!response.ok) {
            throw new Error('Failed to fetch JWT from auth server');
          }
          return response.json();
        })
        .then(function(data) {
          if (data.token) {
            // Pass the signed JWT back to Zendesk
            callback(data.token);
          } else {
            console.error('JWT key missing in response:', data);
          }
        })
        .catch(function(error) {
          console.error('Error authenticating Zendesk user:', error);
        });
    });
  </script>

  <style>
    body { font-family: Arial, sans-serif; margin: 0; padding: 40px; background: #fff8f0; color: #4a2e2b; text-align: center; }

    .card { background: white; padding: 20px; border-radius: 8px; margin: 20px auto; max-width: 400px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
